<html lang="pt-BR">
<meta charset="utf-8">
<title>Fixture de ações administrativas</title>
<div id="fixture"></div>
<script type="module">
import { createApp, h } from 'vue';

import '/src/assets/styles/tokens.css';
import '/src/assets/styles/card-actions.css';
